<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Verilume Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1D1D1F;--paper:#FFFFFF;--paper-dim:#F5F5F7;--cx:#0891B2;--navy:#1E2761;--line:#D2D2D7;--muted:#6E6E73;--bad:#B3261E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--paper-dim);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.card{width:100%;max-width:440px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:36px 32px;box-shadow:0 8px 30px rgba(29,29,31,.06)}
.brand{font-weight:700;font-size:18px;letter-spacing:.01em;color:var(--navy);margin:0 0 22px}
h1{font-size:24px;line-height:1.25;margin:0 0 8px;text-wrap:balance}
p.sub{margin:0 0 24px;color:var(--muted);font-size:15px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--paper);color:var(--ink);margin-bottom:16px}
input:focus-visible,button:focus-visible{outline:2px solid var(--cx);outline-offset:2px}
button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--navy);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:1.4em;margin:12px 0 0;font-size:14px;color:var(--bad)}
</style>
</head>
<body>
<main class="card">
  <div class="brand">Verilume</div>
  <h1 id="ttl">You've Been Invited</h1>
  <p class="sub">Add your password to access your AI Brain</p>
  <form id="f" novalidate>
    <label for="p1">New password</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="p2">Confirm password</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="8" required>
    <button id="go" type="submit">Set password and sign in</button>
    <div id="msg" role="alert"></div>
  </form>
</main>
<script>
(function(){
  var token = new URLSearchParams(location.search).get('token') || '';
  var msg = document.getElementById('msg'), go = document.getElementById('go');
  var meta = document.querySelector('meta[name="verilume-backend-url"]');
  var base = ((meta && meta.getAttribute('content')) || '').replace(/\/+$/, '');
  if (token){
    fetch(base + '/api/auth/invite-info?token=' + encodeURIComponent(token)).then(function(r){ return r.json(); }).then(function(d){
      if (d && d.valid && d.inviterFirstName){ document.getElementById('ttl').textContent = "You've Been Invited by " + d.inviterFirstName; }
    }).catch(function(){});
  }
  if (!token){ msg.textContent = 'This link is missing its token. Open the link from your invitation email, or ask your administrator to resend it.'; go.disabled = true; }
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    if (p1.length < 8){ msg.textContent = 'Use at least 8 characters.'; return; }
    if (p1 !== p2){ msg.textContent = 'The two passwords do not match.'; return; }
    msg.textContent = ''; go.disabled = true; go.textContent = 'Saving...';
    fetch(base + '/api/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ resetToken: token, newPassword: p1 }) })
      .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
      .then(function(x){
        if (!x.ok){ throw new Error(x.d && x.d.error || 'This link could not be used.'); }
        var d = x.d;
        try { localStorage.setItem('verilume_session_' + d.accountId, d.token); localStorage.setItem('verilume_member_' + d.accountId, d.memberId); } catch (err) {}
        try { sessionStorage.setItem('verilume_session_' + d.accountId, d.token); } catch (err) {}
        location.href = 'portal.html?accountId=' + encodeURIComponent(d.accountId);
      })
      .catch(function(err){
        msg.textContent = (err && err.message || 'Could not reach the server.') + ' If the link has expired, ask your administrator to resend the invite.';
        go.disabled = false; go.textContent = 'Set password and sign in';
      });
  });
})();
</script>
</body>
</html>
