<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Set Your Password</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202e;--muted:#5b6778;--line:#d9dee6;--accent:#0f6e6e;--accent-ink:#fff;--bad:#b3261e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#18202a;--ink:#e8edf3;--muted:#98a4b5;--line:#2b3644;--accent:#3fb3b3;--accent-ink:#06201f;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 18px;color:var(--muted);font-size:15px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--bg);color:var(--ink);margin-bottom:14px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;padding:11px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:1.4em;margin:12px 0 0;font-size:14px;color:var(--bad)}
</style>
</head>
<body>
<main class="card">
  <h1>Set your password</h1>
  <p>Choose a password to finish setting up your Verilume login. Use at least 8 characters.</p>
  <form id="f" novalidate>
    <label for="p1">New password</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="p2">Confirm password</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="8" required>
    <button id="go" type="submit">Set password and sign in</button>
    <div id="msg" role="alert"></div>
  </form>
</main>
<script>
(function(){
  var token = new URLSearchParams(location.search).get('token') || '';
  var msg = document.getElementById('msg'), go = document.getElementById('go');
  var meta = document.querySelector('meta[name="verilume-backend-url"]');
  var base = ((meta && meta.getAttribute('content')) || '').replace(/\/+$/, '');
  if (!token){ msg.textContent = 'This link is missing its token. Open the link from your invitation email, or ask your administrator to resend it.'; go.disabled = true; }
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    if (p1.length < 8){ msg.textContent = 'Use at least 8 characters.'; return; }
    if (p1 !== p2){ msg.textContent = 'The two passwords do not match.'; return; }
    msg.textContent = ''; go.disabled = true; go.textContent = 'Saving...';
    fetch(base + '/api/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ resetToken: token, newPassword: p1 }) })
      .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
      .then(function(x){
        if (!x.ok){ throw new Error(x.d && x.d.error || 'This link could not be used.'); }
        var d = x.d;
        try { localStorage.setItem('verilume_session_' + d.accountId, d.token); localStorage.setItem('verilume_member_' + d.accountId, d.memberId); } catch (err) {}
        try { sessionStorage.setItem('verilume_session_' + d.accountId, d.token); } catch (err) {}
        location.href = 'portal.html?accountId=' + encodeURIComponent(d.accountId);
      })
      .catch(function(err){
        msg.textContent = (err && err.message || 'Could not reach the server.') + ' If the link has expired, ask your administrator to resend the invite.';
        go.disabled = false; go.textContent = 'Set password and sign in';
      });
  });
})();
</script>
</body>
</html>
