<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Verilume — Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Mirrors login.html: same split-screen layout, tokens and fonts, so an invited person lands on a page that looks like the real sign-in. */
  :root{
    --ink:#10141B; --paper:#FBFAF6; --white:#FFFFFF;
    --cx:#0B6F62; --advocacy:#B4472B; --line:#D9D4C6; --muted:#625E52;
    --lamp:#F4B63F; --cx-night:#4DD6C0; --media-night:#F4B63F;
    --vl-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
    --vl-body:'Instrument Sans','Avenir Next','Segoe UI',system-ui,sans-serif;
    --vl-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--vl-body);-webkit-font-smoothing:antialiased;}
  .split-wrap{display:flex;min-height:100vh;}
  .brand-panel{position:relative;width:42%;min-width:440px;flex-shrink:0;background:#07090D;overflow:hidden;display:flex;flex-direction:column;padding:44px 48px;}
  .brand-panel .glow{position:absolute;border-radius:50%;filter:blur(10px);}
  .wordmark{font-size:24px;font-weight:600;letter-spacing:-.01em;color:#fff;text-decoration:none;position:relative;}
  .wordmark b{color:var(--lamp);font-weight:600;}
  .brand-body{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;max-width:460px;}
  .eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 22px;font-family:var(--vl-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.68);font-weight:500;}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--lamp);flex-shrink:0;}
  .brand-panel h2{margin:0 0 20px;font-family:var(--vl-display);font-size:36px;line-height:1.18;font-weight:600;letter-spacing:-.02em;color:#fff;text-wrap:balance;}
  .hl-cx{color:var(--cx-night);} .hl-media{color:var(--media-night);}
  .brand-sub{margin:0;font-size:15px;line-height:1.65;color:rgba(255,255,255,.72);max-width:420px;}
  .brand-footnote{position:relative;margin:0;font-size:12.5px;font-style:italic;color:rgba(255,255,255,.42);line-height:1.5;}
  .form-panel{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:24px;}
  .card{width:100%;max-width:360px;}
  .card h1{margin:0 0 6px;font-family:var(--vl-display);font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.02em;text-wrap:balance;}
  .lede{margin:0 0 28px;font-size:14px;line-height:1.55;color:var(--muted);}
  .field{margin-bottom:16px;position:relative;}
  .field label{display:block;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;}
  .field input{width:100%;padding:11px 38px 11px 38px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14.5px;background:#fff;color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease;}
  .field input:focus{outline:none;border-color:var(--cx);box-shadow:0 0 0 3px rgba(11,111,98,.16);}
  .field .ico{position:absolute;left:13px;top:38px;pointer-events:none;}
  .field .tog{position:absolute;right:13px;top:38px;cursor:pointer;background:none;border:none;padding:0;line-height:0;}
  .field .tog:focus-visible{outline:2px solid var(--cx);outline-offset:2px;}
  .btn-primary{background:var(--lamp);color:#10141B;font-family:inherit;font-weight:600;font-size:14px;padding:12px 20px;border-radius:999px;border:0;cursor:pointer;width:100%;transition:box-shadow .15s ease;}
  .btn-primary:hover{box-shadow:0 0 0 6px rgba(244,182,63,.25);}
  .btn-primary:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
  .error-note{color:var(--advocacy);font-size:12.5px;margin-top:10px;min-height:1em;}
  .back-site{position:absolute;top:28px;right:32px;font-family:var(--vl-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;}
  .back-site:hover{color:var(--ink);}
  .mobile-mark{display:none;font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 28px;color:var(--ink);text-decoration:none;}
  .mobile-mark b{color:#A8680A;font-weight:600;}
  @media (max-width:900px){.brand-panel{display:none;}.split-wrap{min-height:auto;}.back-site{top:16px;right:20px;}.mobile-mark{display:inline-block;}.card{padding-top:36px;}}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;}}
</style>
</head>
<body>
<div class="split-wrap">
  <div class="brand-panel">
    <div class="glow" style="left:-160px;top:-140px;width:560px;height:560px;background:radial-gradient(circle, rgba(77,214,192,0.16) 0%, rgba(77,214,192,0) 70%);"></div>
    <div class="glow" style="right:-220px;top:280px;width:640px;height:640px;background:radial-gradient(circle, rgba(244,182,63,0.10) 0%, rgba(244,182,63,0) 68%);"></div>
    <div class="glow" style="left:-120px;bottom:-200px;width:520px;height:520px;background:radial-gradient(circle, rgba(244,182,63,0.14) 0%, rgba(244,182,63,0) 70%);"></div>
    <a class="wordmark" href="index.html" aria-label="Verilume home">Veri<b>lume</b></a>
    <div class="brand-body">
      <p class="eyebrow"><span class="dot"></span> Truth &amp; Light</p>
      <h2>Humans <span class="hl-cx">decide.</span> AI <span class="hl-media">recommends.</span></h2>
      <p class="brand-sub">Your team keeps every decision; the AI does the always-on work in between.</p>
    </div>
    <p class="brand-footnote">Veri, Latin for truth. Lume, light.</p>
  </div>

  <div class="form-panel">
    <a class="back-site" href="index.html">← Back to site</a>
    <div class="card">
      <a class="mobile-mark" href="index.html" aria-label="Verilume home">Veri<b>lume</b></a>
      <h1 id="ttl">You've Been Invited</h1>
      <p class="lede">Add your password to access your AI Brain</p>
      <form id="f" novalidate>
        <div class="field">
          <label for="p1">Password</label>
          <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          <input type="password" id="p1" autocomplete="new-password" placeholder="At least 8 characters">
          <button type="button" class="tog" aria-label="Show password" data-for="p1"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </div>
        <div class="field">
          <label for="p2">Confirm password</label>
          <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          <input type="password" id="p2" autocomplete="new-password">
          <button type="button" class="tog" aria-label="Show password" data-for="p2"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </div>
        <button class="btn-primary" id="go" type="submit">Set password and sign in</button>
        <div class="error-note" id="msg" role="alert"></div>
      </form>
    </div>
  </div>
</div>
<script>
(function(){
  var token = new URLSearchParams(location.search).get('token') || '';
  var msg = document.getElementById('msg'), go = document.getElementById('go');
  var base = (typeof window !== 'undefined' && window.location && window.location.protocol !== 'file:') ? '' : 'http://localhost:8787';

  Array.prototype.forEach.call(document.querySelectorAll('.tog'), function(b){
    b.addEventListener('click', function(){
      var i = document.getElementById(b.getAttribute('data-for'));
      var showing = i.type === 'text';
      i.type = showing ? 'password' : 'text';
      b.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  });

  if (token){
    fetch(base + '/api/auth/invite-info?token=' + encodeURIComponent(token))
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.valid && d.inviterFirstName){ document.getElementById('ttl').textContent = "You've Been Invited by " + d.inviterFirstName; } })
      .catch(function(){});
  } else {
    msg.textContent = 'This link is missing its token. Open the link from your invitation email, or ask your administrator to resend it.';
    go.disabled = true;
  }

  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    if (p1.length < 8){ msg.textContent = 'Password must be at least 8 characters.'; return; }
    if (p1 !== p2){ msg.textContent = "Passwords don't match."; return; }
    msg.textContent = ''; go.disabled = true; go.textContent = 'Saving...';
    fetch(base + '/api/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ resetToken: token, newPassword: p1 }) })
      .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
      .then(function(x){
        if (!x.ok){ throw new Error((x.d && x.d.error) || 'This link could not be used.'); }
        var d = x.d;
        // Same keys login.html writes, so the portal and the utility nav recognize the session.
        try {
          localStorage.setItem('verilume_session_' + d.accountId, d.token);
          if (d.memberId) localStorage.setItem('verilume_member_' + d.accountId, d.memberId);
          localStorage.setItem('verilume_active_account', d.accountId);
        } catch (err) {}
        location.href = 'portal.html?accountId=' + encodeURIComponent(d.accountId);
      })
      .catch(function(err){
        msg.textContent = ((err && err.message) || 'Could not reach the server.') + ' If the link has expired, ask the person who invited you to resend it.';
        go.disabled = false; go.textContent = 'Set password and sign in';
      });
  });
})();
</script>
</body>
</html>
