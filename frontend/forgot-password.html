<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verilume — Reset Your Password</title>
<meta name="description" content="Reset your Verilume account password.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
    2026-08-19 (login redesign) — password recovery, promoted out of
    account.html's login-gate modal into its own standalone public page,
    per direct instruction ("Change of password via Forgot Password needs
    to be a path outside of the portal"). Same three real endpoints as
    before (request-password-reset / verify-phone-code / reset-password),
    same interim-on-screen-code convention until Twilio credentials are
    live — just no longer nested inside a page that itself requires being
    logged in to reach.
  */
  :root{
    --ink:#1D1D1F; --paper:#FFFFFF; --paper-dim:#F5F5F7;
    --media:#2563EB; --cx:#0891B2; --advocacy:#4F46E5;
    --line:#D2D2D7; --white:#FFFFFF; --muted:#6E6E73;
    --radius-sm:12px;
    --shadow-lg:0 16px 48px rgba(0,0,0,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:
      radial-gradient(ellipse 700px 460px at 6% 0%, rgba(8,145,178,0.08) 0%, rgba(8,145,178,0) 58%),
      radial-gradient(ellipse 700px 500px at 98% 10%, rgba(37,99,235,0.10) 0%, rgba(37,99,235,0) 60%),
      var(--paper);
    color:var(--ink);font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  .back-nav{font-size:12px;letter-spacing:0.04em;padding:20px 28px;}
  .back-nav a.wordmark{font-size:20px;font-weight:500;color:var(--ink);text-decoration:none;}
  .back-nav a.wordmark b{color:var(--media);font-weight:500;}

  .center-wrap{min-height:calc(100vh - 90px);display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);padding:40px 36px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);}
  .login-card h1{margin:0 0 8px;font-size:24px;font-weight:600;}
  .login-card .lede{margin:0 0 24px;font-size:14px;line-height:1.55;color:var(--muted);}

  .field{margin-bottom:16px;}
  .field label{display:block;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:6px;}
  .field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14.5px;background:var(--paper);color:var(--ink);transition:border-color 0.15s ease,box-shadow 0.15s ease;}
  .field input:focus{outline:none;border-color:var(--cx);box-shadow:0 0 0 3px rgba(8,145,178,0.14);}

  .btn-primary{background:var(--ink);color:var(--white);font-weight:600;font-size:14px;padding:12px 20px;border-radius:999px;border:none;cursor:pointer;width:100%;transition:transform 0.15s ease,background 0.15s ease;}
  .btn-primary:hover{background:#1c2d54;transform:translateY(-1px);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

  .status-note{font-size:12.5px;color:var(--cx);margin-top:10px;min-height:1em;}
  .error-note{color:var(--advocacy);font-size:12.5px;margin-top:10px;min-height:1em;}

  .link-row{margin-top:20px;}
  .link-row a{font-size:12.5px;color:var(--cx);text-decoration:none;font-weight:600;}
  .link-row a:hover{text-decoration:underline;}

  #codeView, #passwordView{display:none;}

  /* 2026-08-21 — sitewide utility nav, per direct instruction ("we really
     should have a utility nav above the main nav that includes Access My
     Portal and the LogIn/Logout function"). One consistent strip, same
     markup/position on every page (public marketing pages AND the
     authenticated app pages), sitting above whatever header that page
     already has. Solves three things raised together: (1) Logout was
     landing in a different spot on different pages — now it's always
     here; (2) there was no way back to the Portal once you navigated
     away from it; (3) auth state (logged in vs not) now reads the same
     sessionStorage pointer everywhere, so this bar and any page's own
     logic agree. See the #utilityNav script block for the actual logic. */
  .utility-nav{background:var(--ink);}
  .utility-nav-inner{max-width:1200px;margin:0 auto;padding:10px 28px;display:flex;justify-content:flex-end;align-items:center;gap:12px;font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}
  /* 2026-08-21 fix, per direct correction ("We have a stylized button
     approach that we perfect in the previous location and used across the
     website") — the first version of this bar used plain uppercase text
     links, not the site's actual pill-button convention (the public "Log
     in" pill, .nav-login elsewhere: bordered pill, mixed-case text,
     8px/16px padding). Rebuilt to match that same pill shape, just with
     light-on-dark colors instead of dark-on-light, since this bar's
     background is var(--ink) — same color-inversion approach already used
     for the dark-header Logout pill on account.html/print-specs.html/
     ooh-specs.html. border-radius is hardcoded to 999px rather than
     var(--radius-pill) because several pages this bar lives on
     (forgot-password.html, select-tier.html, terms.html) never define
     that variable at all. */
  .utility-nav-inner a{font-size:12.5px;font-weight:600;color:rgba(255,255,255,0.92);text-decoration:none;padding:8px 16px;border:1px solid rgba(255,255,255,0.38);border-radius:999px;white-space:nowrap;transition:border-color 0.2s ease, background 0.2s ease;}
  .utility-nav-inner a:hover{border-color:#fff;background:rgba(255,255,255,0.08);}
</style>
</head>
<body>
<div class="utility-nav" id="utilityNav">
  <div class="utility-nav-inner">
    <a href="portal.html" id="utilNavPortalLink" style="display:none;">Access My Portal</a>
    <a href="login.html" id="utilNavAuthLink">Log in</a>
  </div>
</div>
<script>
// 2026-08-21 — shared utility-nav logic, identical on every page (see the
// .utility-nav CSS comment for why). Reads a single sessionStorage pointer
// (verilume_active_account) that login.html / assessment.html's Save &
// Schedule flow set on successful sign-in, and that this same script's own
// Logout handler (and every page's own logout(), where one exists) clears.
// Deliberately self-contained (its own vlUtilBackendUrl(), not the page's
// BACKEND_URL) so it works unmodified on pages that don't otherwise talk to
// the backend at all (marketing pages, terms.html, etc.).
(function(){
  function vlUtilBackendUrl(){
    return (typeof window !== 'undefined' && window.location && window.location.protocol !== 'file:')
      ? ''
      : 'http://localhost:8787';
  }
  function vlActiveAccountId(){
    try { return localStorage.getItem('verilume_active_account') || ''; } catch (e) { return ''; }
  }
  function vlUtilityNavInit(){
    var accountId = vlActiveAccountId();
    var portalLink = document.getElementById('utilNavPortalLink');
    var authLink = document.getElementById('utilNavAuthLink');
    if (!portalLink || !authLink) return;
    if (accountId){
      portalLink.href = 'portal.html?accountId=' + encodeURIComponent(accountId);
      portalLink.style.display = '';
      authLink.textContent = 'Logout';
      authLink.href = '#';
      authLink.onclick = function(e){
        e.preventDefault();
        var token = null;
        try { token = localStorage.getItem('verilume_session_' + accountId); } catch (e2) {}
        var finish = function(){
          try {
            localStorage.removeItem('verilume_session_' + accountId);
            localStorage.removeItem('verilume_member_' + accountId);
            localStorage.removeItem('verilume_active_account');
          } catch (e3) {}
          location.href = '/';
        };
        if (token){
          fetch(vlUtilBackendUrl() + '/api/auth/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token })
          }).then(finish).catch(finish);
        } else {
          finish();
        }
      };
    } else {
      portalLink.style.display = 'none';
      authLink.textContent = 'Log in';
      authLink.href = 'login.html';
      authLink.onclick = null;
    }
  }
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', vlUtilityNavInit);
  } else {
    vlUtilityNavInit();
  }
  window.vlUtilityNavInit = vlUtilityNavInit; // exposed so login()/logout() elsewhere can re-run it after changing session state without a full reload
})();
</script>


<div class="back-nav"><a class="wordmark" href="index.html">Veri<b>lume</b></a></div>

<div class="center-wrap">
  <div class="login-card">

    <div id="emailView">
      <h1>Reset your password</h1>
      <p class="lede">Enter the email on your Verilume account — if it has a phone number on file, we'll text a verification code to it.</p>
      <div class="field">
        <label for="recoveryEmail">Email</label>
        <input type="email" id="recoveryEmail" onkeydown="if(event.key==='Enter')submitRecoveryEmail();">
      </div>
      <button class="btn-primary" id="emailBtn" onclick="submitRecoveryEmail()">Send code</button>
      <div class="error-note" id="emailError"></div>
      <div class="link-row"><a href="login.html">← Back to sign in</a></div>
    </div>

    <div id="codeView">
      <h1>Enter your code</h1>
      <p class="lede" id="codeLede"></p>
      <div class="field">
        <label for="recoveryCode">6-digit code</label>
        <input type="text" id="recoveryCode" inputmode="numeric" maxlength="6" onkeydown="if(event.key==='Enter')submitRecoveryCode();">
      </div>
      <button class="btn-primary" id="codeBtn" onclick="submitRecoveryCode()">Verify</button>
      <div class="error-note" id="codeError"></div>
      <div class="link-row"><a href="login.html">← Back to sign in</a></div>
    </div>

    <div id="passwordView">
      <h1>Choose a new password</h1>
      <p class="lede">At least 8 characters.</p>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitRecoveryPassword();">
      </div>
      <div class="field">
        <label for="newPasswordConfirm">Confirm new password</label>
        <input type="password" id="newPasswordConfirm" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitRecoveryPassword();">
      </div>
      <button class="btn-primary" id="passwordBtn" onclick="submitRecoveryPassword()">Set password and sign in</button>
      <div class="error-note" id="passwordError"></div>
    </div>

  </div>
</div>

<script>
const BACKEND_URL = (typeof window !== 'undefined' && window.location && window.location.protocol !== 'file:')
  ? ''
  : 'http://localhost:8787';

const params = new URLSearchParams(location.search);
const nextUrl = params.get('next');
const prefillEmail = params.get('email');
if (prefillEmail) document.getElementById('recoveryEmail').value = prefillEmail;

function sessionStorageKey(accountId){
  return `verilume_session_${accountId}`;
}
function memberStorageKey(accountId){
  return `verilume_member_${accountId}`;
}
function persistSessionFor(accountId, token, memberId){
  try {
    localStorage.setItem(sessionStorageKey(accountId), token);
    if (memberId) localStorage.setItem(memberStorageKey(accountId), memberId);
  } catch (e) {}
}
function destinationFor(accountId){
  if (nextUrl) return nextUrl;
  return `portal.html?accountId=${encodeURIComponent(accountId)}`;
}

let recoveryVerificationId = null;
let recoveryResetToken = null;

async function submitRecoveryEmail(){
  const email = document.getElementById('recoveryEmail').value.trim();
  const errEl = document.getElementById('emailError');
  const btn = document.getElementById('emailBtn');
  if (!email.includes('@')){ errEl.textContent = 'Enter a valid email address.'; return; }
  btn.disabled = true;
  errEl.textContent = '';
  try {
    const resp = await fetch(`${BACKEND_URL}/api/auth/request-password-reset`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok){
      errEl.textContent = data.error || `Couldn't request a reset (${resp.status}).`;
      btn.disabled = false;
      return;
    }
    if (!data.verificationId){
      // Generic response — either the email doesn't exist here, or it has
      // no phone on file. Deliberately worded the same either way (see the
      // endpoint's own comment) so this page never confirms/denies whether
      // an email is registered.
      errEl.style.color = 'var(--cx)';
      errEl.textContent = data.message || 'If that email has a phone number on file, a code was sent to it.';
      btn.disabled = false;
      return;
    }
    recoveryVerificationId = data.verificationId;
    document.getElementById('emailView').style.display = 'none';
    document.getElementById('codeView').style.display = 'block';
    document.getElementById('recoveryCode').value = '';
    document.getElementById('codeError').textContent = '';
    document.getElementById('codeLede').textContent =
      `We sent a 6-digit code to the phone on file ending in ${data.phoneLast4}.`
      + (data.provider === 'interim' ? ` No SMS provider is connected yet, so here it is instead: ${data.interimCode}` : '');
  } catch (e){
    errEl.textContent = 'Could not reach the backend — try again.';
    btn.disabled = false;
  }
}

async function submitRecoveryCode(){
  const code = document.getElementById('recoveryCode').value.trim();
  const errEl = document.getElementById('codeError');
  const btn = document.getElementById('codeBtn');
  if (!code){ errEl.textContent = 'Enter the code.'; return; }
  btn.disabled = true;
  errEl.textContent = '';
  try {
    const resp = await fetch(`${BACKEND_URL}/api/auth/verify-phone-code`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verificationId: recoveryVerificationId, code })
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok){
      errEl.textContent = data.error || `Couldn't verify that code (${resp.status}).`;
      btn.disabled = false;
      return;
    }
    if (!data.resetToken){
      errEl.textContent = 'Verified, but no reset link came back — try starting over.';
      btn.disabled = false;
      return;
    }
    recoveryResetToken = data.resetToken;
    document.getElementById('codeView').style.display = 'none';
    document.getElementById('passwordView').style.display = 'block';
    document.getElementById('newPassword').value = '';
    document.getElementById('newPasswordConfirm').value = '';
    document.getElementById('passwordError').textContent = '';
  } catch (e){
    errEl.textContent = 'Could not reach the backend — try again.';
    btn.disabled = false;
  }
}

async function submitRecoveryPassword(){
  const pw = document.getElementById('newPassword').value;
  const pwConfirm = document.getElementById('newPasswordConfirm').value;
  const errEl = document.getElementById('passwordError');
  const btn = document.getElementById('passwordBtn');
  if (pw.length < 8){ errEl.textContent = 'Password must be at least 8 characters.'; return; }
  if (pw !== pwConfirm){ errEl.textContent = "Passwords don't match."; return; }
  btn.disabled = true;
  errEl.textContent = '';
  try {
    const resp = await fetch(`${BACKEND_URL}/api/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resetToken: recoveryResetToken, newPassword: pw })
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok){
      errEl.textContent = data.error || `Couldn't reset your password (${resp.status}).`;
      btn.disabled = false;
      return;
    }
    persistSessionFor(data.accountId, data.token, data.memberId);
    location.href = destinationFor(data.accountId);
  } catch (e){
    errEl.textContent = 'Could not reach the backend — try again.';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
