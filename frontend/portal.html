<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="verilume-backend-url" content="https://verilume-api-production.up.railway.app">
<title>Verilume Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#F6F4EE;color:#14213D;font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.sh{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.sh h1{font-size:1.25rem;font-weight:600;margin:0}
.sh p{margin:0;color:#5B5647;max-width:34em;line-height:1.5}
.bar{width:180px;height:4px;border-radius:4px;background:#E4E0D3;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:#C9932E;animation:mv 1.1s ease-in-out infinite}
@keyframes mv{0%{margin-left:-40%}100%{margin-left:100%}}
.btns{display:none;gap:10px;flex-wrap:wrap;justify-content:center}
.btns button,.btns a{font:600 14px Poppins,system-ui,sans-serif;border-radius:999px;padding:10px 20px;cursor:pointer;text-decoration:none;border:1px solid #14213D}
.btns button{background:#14213D;color:#fff}.btns a{background:#fff;color:#14213D}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div class="sh" id="sh" role="status" aria-live="polite">
  <h1 id="shT">Opening your portal</h1>
  <div class="bar" id="shBar"><i></i></div>
  <p id="shM">One moment while we check your sign-in.</p>
  <div class="btns" id="shB"><button type="button" id="shRetry">Try again</button><a id="shLogin" href="login.html">Log in</a></div>
</div>
<script>
/* Portal loader. The portal's screens and rules are not in this file: they are fetched after sign-in from /api/app/portal and are only
   sent to a valid session. No session, no portal code. */
(function(){
  var qs = new URLSearchParams(location.search);
  var acct = qs.get('accountId') || '';
  try { if (!acct) acct = localStorage.getItem('verilume_active_account') || ''; } catch (e) {}
  var tok = '';
  try { tok = localStorage.getItem('verilume_session_' + acct) || sessionStorage.getItem('verilume_session_' + acct) || ''; } catch (e) {}
  var meta = document.querySelector('meta[name="verilume-backend-url"]');
  var base = (meta && (meta.getAttribute('content') || '').trim().replace(/\/+$/, '')) || (location.protocol === 'file:' ? 'http://localhost:8787' : '');
  var next = encodeURIComponent(location.pathname + location.search);
  function toLogin(){ location.href = 'login.html?next=' + next; }
  function fail(msg){
    document.getElementById('shT').textContent = 'We could not open your portal';
    document.getElementById('shM').textContent = msg;
    document.getElementById('shBar').style.display = 'none';
    document.getElementById('shB').style.display = 'flex';
    document.getElementById('shLogin').href = 'login.html?next=' + next;
  }
  if (!tok) { toLogin(); return; }
  function open(){
    document.getElementById('shB').style.display = 'none';
    document.getElementById('shBar').style.display = '';
    document.getElementById('shT').textContent = 'Opening your portal';
    document.getElementById('shM').textContent = 'One moment while we check your sign-in.';
    var ctl = new AbortController(); var timer = setTimeout(function(){ ctl.abort(); }, 45000);
    fetch(base + '/api/app/portal', { headers: { Authorization: 'Bearer ' + tok }, cache: 'no-store', signal: ctl.signal })
      .then(function(r){
        clearTimeout(timer);
        if (r.status === 401) { toLogin(); return null; }
        if (!r.ok) return r.json().catch(function(){ return {}; }).then(function(j){ throw new Error(j.error || ('The portal returned an error (' + r.status + ').')); });
        return r.text();
      })
      .then(function(html){
        if (html == null) return;
        document.open(); document.write(html); document.close();
      })
      .catch(function(e){ clearTimeout(timer); fail(e && e.name === 'AbortError' ? 'This is taking longer than expected. Check your connection and try again.' : ((e && e.message) || 'Please try again.')); });
  }
  document.getElementById('shRetry').addEventListener('click', open);
  open();
})();
</script>
<noscript><p style="padding:24px">The Verilume portal needs JavaScript. Please turn it on and reload.</p></noscript>
</body>
</html>
